title: Invoice INV-0001
description: Demo subscription invoice billing against the platform-redesign SOW.

# Page-level query surfaces the invoices on every section as data.invoices.
# SOWs are reachable via block.website.config.recordsByQuery.sows (unipress's
# synchronous cross-page fallback), which the foundation handler uses for
# cross-record validation without a second query.
query: invoices
