# ─────────────────────────────────────────────────────────
# unipress — end-to-end smoke test
#
# scripts/smoke.js, twice: on this checkout under Node, and on a binary compiled
# from it. Each scaffolds every template, compiles it to every format it lists on
# each paper, and reads the result: a file of the right kind, on the page asked
# for, with its chapter titles once and its tables and footnotes where they go.
# EPUBs also go through EPUBCheck, which stores use to accept a book.
#
# The binary is the part nothing else runs. A native module reaching its import
# graph stops it starting, on every command, with everything under Node still
# green. (From 2026-09-28 to 2026-10-31 no binary built from this repo could start.)
#
# ⚠️ Foundations and the CLI are built against what is on npm (see
# ci-flip-workspace-deps.js), so a commit that needs an unpublished framework
# change fails here until that change is published.
#
# Trigger:
#   - push to main (post-merge regression net)
#   - pull_request (pre-merge gate)
# ─────────────────────────────────────────────────────────

name: E2E Smoke Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "e2e-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  scaffold-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm is installed before setup-node on purpose. setup-node v5+ turns on
      # package-manager caching by itself when package.json carries a
      # `packageManager` field, and that caching needs pnpm already on PATH.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Flip workspace:* to npm versions
        # Same prep as deploy-foundations.yml. See
        # scripts/ci-flip-workspace-deps.js.
        run: node scripts/ci-flip-workspace-deps.js

      - name: Install CLI dependencies
        run: pnpm install --ignore-workspace --no-frozen-lockfile

      - name: Build foundations
        shell: bash
        run: |
          set -e
          for foundation_dir in foundations/*/; do
            name=$(basename "$foundation_dir")
            echo "===== Building $name ====="
            (cd "$foundation_dir" && pnpm install --ignore-workspace --no-frozen-lockfile)
            (cd "$foundation_dir" && pnpm build)
            test -f "$foundation_dir/dist/entry.js" || {
              echo "::error::no dist/entry.js produced for $name"
              exit 1
            }
          done

      - name: Regenerate templates-data.js
        # `documents/` should already be in sync with `src/templates-data.js`
        # (prepublishOnly enforces this at publish), but regenerating in CI
        # catches drift before publish — if `documents/` has changes that
        # weren't reflected in the committed templates-data.js, the next
        # step's scaffold uses the freshly-generated templates instead of
        # whatever's in the repo. Equivalent to what publish does; runs
        # before every test so dev-time stale states get exercised too.
        run: node scripts/generate-templates-data.js

      - name: Unit tests
        run: pnpm test

      - name: Fetch EPUBCheck
        shell: bash
        run: |
          curl -fsSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          unzip -q epubcheck.zip -d _epubcheck

      - name: Every template, every format, each paper
        run: node scripts/smoke.js --epubcheck _epubcheck/epubcheck-5.2.1/epubcheck.jar

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Compile the binary
        run: node scripts/build-binaries.js --target bun-linux-x64 --out dist-bin

      - name: The same, on the binary
        run: node scripts/smoke.js --bin dist-bin/unipress-linux-x64 --foundations local
