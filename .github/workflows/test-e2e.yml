# ─────────────────────────────────────────────────────────
# unipress — end-to-end smoke test
#
# scripts/smoke.js on this checkout under Node, then on a binary compiled from it,
# on each system the release builds for. Each scaffolds every template, compiles it
# to every format it lists on each paper, and reads the result: a file of the right
# kind, on the page asked for, with its chapter titles once and its tables and
# footnotes where they go. EPUBs also go through EPUBCheck, which stores use to
# accept a book.
#
# The binary is the part nothing else runs. A native module reaching its import
# graph stops it starting, on every command, with everything under Node still
# green. (From 2026-09-28 to 2026-10-31 no binary built from this repo could start.)
#
# A system is the other part. Until 2026-10-31 this ran on Linux with no PDF, and
# the PDFs were made on macOS alone: none could be made on Linux.
#
# ⚠️ Foundations and the CLI are built against what is on npm (see
# ci-flip-workspace-deps.js), so a commit that needs an unpublished framework
# change fails here until that change is published.
#
# Trigger:
#   - push to main (post-merge regression net)
#   - pull_request (pre-merge gate)
#   - by hand, with foundations: pinned, to run the binaries as the release does:
#     with what the templates pin, fetched over the network. Those have to be
#     deployed, so it is for a release whose foundations already are.
# ─────────────────────────────────────────────────────────

name: E2E Smoke Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      foundations:
        description: 'What the binaries compile with'
        type: choice
        options: [local, pinned]
        default: local

permissions:
  contents: read

concurrency:
  group: "e2e-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  scaffold-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm is installed before setup-node on purpose. setup-node v5+ turns on
      # package-manager caching by itself when package.json carries a
      # `packageManager` field, and that caching needs pnpm already on PATH.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Flip workspace:* to npm versions
        # Same prep as deploy-foundations.yml. See
        # scripts/ci-flip-workspace-deps.js.
        run: node scripts/ci-flip-workspace-deps.js

      - name: Install CLI dependencies
        run: pnpm install --ignore-workspace --no-frozen-lockfile

      - name: Build foundations
        shell: bash
        run: |
          set -e
          for foundation_dir in foundations/*/; do
            name=$(basename "$foundation_dir")
            echo "===== Building $name ====="
            (cd "$foundation_dir" && pnpm install --ignore-workspace --no-frozen-lockfile)
            (cd "$foundation_dir" && pnpm build)
            test -f "$foundation_dir/dist/entry.js" || {
              echo "::error::no dist/entry.js produced for $name"
              exit 1
            }
          done

      - name: Regenerate templates-data.js
        # `documents/` should already be in sync with `src/templates-data.js`
        # (prepublishOnly enforces this at publish), but regenerating in CI
        # catches drift before publish — if `documents/` has changes that
        # weren't reflected in the committed templates-data.js, the next
        # step's scaffold uses the freshly-generated templates instead of
        # whatever's in the repo. Equivalent to what publish does; runs
        # before every test so dev-time stale states get exercised too.
        run: node scripts/generate-templates-data.js

      - name: Unit tests
        run: pnpm test

      - name: Fetch EPUBCheck
        shell: bash
        run: |
          curl -fsSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.2.1/epubcheck-5.2.1.zip
          unzip -q epubcheck.zip -d _epubcheck

      - name: Every template, every format, each paper
        run: node scripts/smoke.js --epubcheck _epubcheck/epubcheck-5.2.1/epubcheck.jar

  # The release's three builds, on its runners, short of signing them. What fails
  # here would otherwise fail in the release, after the version is on npm.
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: bun-darwin-arm64
            artifact: unipress-darwin-arm64
          - platform: ubuntu-22.04
            target: bun-linux-x64
            artifact: unipress-linux-x64
          - platform: windows-latest
            target: bun-windows-x64
            artifact: unipress-windows-x64.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Flip workspace:* to npm versions
        run: node scripts/ci-flip-workspace-deps.js

      - name: Install CLI dependencies
        run: pnpm install --ignore-workspace --no-frozen-lockfile

      - name: Build foundations
        if: ${{ inputs.foundations != 'pinned' }}
        shell: bash
        run: |
          set -e
          for foundation_dir in foundations/*/; do
            (cd "$foundation_dir" && pnpm install --ignore-workspace --no-frozen-lockfile)
            (cd "$foundation_dir" && pnpm build)
          done

      - name: Compile the binary
        run: node scripts/build-binaries.js --target ${{ matrix.target }} --out dist-bin

      # bash on every system: it is what the release runs this in, and on Windows it puts
      # Git's own tar first on the PATH.
      - name: The same, on the binary
        shell: bash
        run: node scripts/smoke.js --bin "dist-bin/${{ matrix.artifact }}" --foundations ${{ inputs.foundations || 'local' }}

  # What a Windows user runs, in the PowerShell every Windows machine has. It installs real releases,
  # so it needs no build: an older version, then an update over it, then a first compile.
  install-windows:
    runs-on: windows-latest
    env:
      SCRIPT: https://raw.githubusercontent.com/uniweb/unipress/${{ github.sha }}/install.ps1
    steps:
      - name: A PATH entry the script has to leave as written
        shell: powershell
        run: |
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
          $path = [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $key.SetValue('Path', "$path;%USERPROFILE%\keep-me".TrimStart(';'), [Microsoft.Win32.RegistryValueKind]::ExpandString)
          $key.Close()

      - name: The one-liner, from Command Prompt, for an older version
        shell: cmd
        env:
          UNIPRESS_VERSION: 1.1.21
        run: powershell -ExecutionPolicy ByPass -c "irm %SCRIPT% | iex"

      - name: It installed that version, on the user's PATH, with no web mark
        shell: powershell
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\unipress"
          $got = & "$dir\unipress.exe" --version
          if ($got -ne '1.1.21') { throw "installed $got, not 1.1.21" }
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $path = [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $key.Close()
          if (($path -split ';') -notcontains $dir) { throw "$dir is not on the PATH: $path" }
          if (($path -split ';') -notcontains '%USERPROFILE%\keep-me') { throw "an entry was expanded or lost: $path" }
          $mark = Get-Item "$dir\unipress.exe" -Stream Zone.Identifier -ErrorAction SilentlyContinue
          if ($mark) { Write-Host '::warning::the installed binary carries a web mark, so SmartScreen may check it' } else { Write-Host 'no web mark' }

      - name: Running it again updates, and adds no second PATH entry
        shell: powershell
        run: |
          irm $env:SCRIPT | iex
          $latest = (irm https://api.github.com/repos/uniweb/unipress/releases/latest -Headers @{ Authorization = "Bearer ${{ github.token }}" }).tag_name.TrimStart('v')
          $got = unipress --version
          if ($got -ne $latest) { throw "updated to $got, not $latest" }
          $dir = "$env:LOCALAPPDATA\Programs\unipress"
          $count = @([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_ -eq $dir }).Count
          if ($count -ne 1) { throw "$dir is on the PATH $count times" }

      - name: A version that doesn't exist fails, and leaves what was there
        shell: powershell
        run: |
          $env:UNIPRESS_VERSION = '0.0.0'
          $failed = $false
          try { irm $env:SCRIPT | iex } catch { $failed = $true; Write-Host "said: $_" }
          if (-not $failed) { throw 'it did not fail' }
          & "$env:LOCALAPPDATA\Programs\unipress\unipress.exe" --version

      - name: A new terminal finds it, and it compiles
        shell: powershell
        run: |
          # What a new terminal starts from: the system's PATH and the user's, not this step's.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          Set-Location (New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\first-document").FullName
          unipress create paper --template article --title "First document" --author "Install check" --paper letter --yes
          unipress compile paper --format pdf --out paper.pdf
          $head = [Text.Encoding]::ASCII.GetString((Get-Content paper.pdf -Encoding Byte -TotalCount 5))
          if ($head -ne '%PDF-') { throw "paper.pdf starts with $head" }
