# ─────────────────────────────────────────────────────────
# unipress — deploy bundled foundations to GitHub Pages
#
# Builds the foundations under foundations/<name>/ whose version is not
# deployed yet, and publishes each dist/ tree at:
#
#   https://uniweb.github.io/unipress/foundations/<name>/<version>/
#
# ⛔ A DEPLOYED VERSION NEVER CHANGES. A document pins a foundation by version,
# and a binary out in the world bundles the @uniweb/core it was built with. A
# foundation is built against the kit on npm, and a kit newer than a binary's
# core can import what that core does not have. So rebuilding a version in place
# breaks every older binary on its next fresh download. (Until this rule, it did:
# a rebuild of 0.4.2 left the installed 0.4.29 binary failing on 7 of 8 templates.)
# New code needs a new version in foundations/<name>/package.json.
#
# Trigger:
#   - a v* tag, which the release pushes after publishing to npm. A foundation is
#     built against what is on npm, so this is the moment that holds what the
#     release ships. A push to main does not deploy: it would freeze a new
#     version against the previous release's Press and kit.
#   - workflow_dispatch (manual re-run from the Actions tab)
#
# This is the open-source distribution path for unipress's bundled
# foundations. The Uniweb registry remains the path for private,
# CDN-backed foundations served to the commercial editor; this
# workflow is for the public artifacts the unipress CLI scaffolds
# into.
# ─────────────────────────────────────────────────────────

name: Deploy Foundations

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # writes to gh-pages branch

concurrency:
  group: "deploy-foundations"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the previous tag, to say what changed without a new version

      # pnpm is installed before setup-node on purpose. setup-node v5+ turns on
      # package-manager caching by itself when package.json carries a
      # `packageManager` field, and that caching needs pnpm already on PATH.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Wait for this release on npm
        # The tag follows the publish, but the registry can take a while to show
        # it (up to an hour, so far), and a foundation built before it does is
        # frozen against the last one.
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 150); do
            if [ "$(npm view "@uniweb/unipress@$version" version 2>/dev/null)" = "$version" ]; then
              echo "@uniweb/unipress@$version is on npm"
              exit 0
            fi
            echo "not on npm yet ($attempt)"; sleep 30
          done
          echo "::error::@uniweb/unipress@$version never appeared on npm"
          exit 1

      - name: Flip workspace:* to npm versions
        # Foundations and the CLI declare @uniweb/* deps as workspace:*
        # so dev machines (cloning the outer monorepo) resolve to local
        # siblings. CI checks out only this repo — there's no workspace
        # around — and pnpm refuses workspace:* outside a workspace.
        # The script reads the npm-current version of each sibling and
        # rewrites every workspace:* in foundations/*/package.json (and
        # the root package.json) to ^<version>. Runner-only mutation;
        # not committed back.
        run: node scripts/ci-flip-workspace-deps.js

      - name: Install dependencies
        run: pnpm install --ignore-workspace --no-frozen-lockfile

      - name: Check out what is deployed
        shell: bash
        run: |
          if git fetch origin gh-pages 2>/dev/null; then
            git worktree add -b gh-pages _gh-pages FETCH_HEAD
          else
            git worktree add --detach _gh-pages
            (cd _gh-pages && git checkout --orphan gh-pages && git rm -rf . 2>/dev/null || true)
          fi

      - name: Build the versions not deployed yet
        shell: bash
        run: |
          set -e
          mkdir -p _staging
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          for foundation_dir in foundations/*/; do
            name=$(basename "$foundation_dir")
            version=$(jq -r '.version' "$foundation_dir/package.json")
            if [ -z "$version" ] || [ "$version" = "null" ]; then
              echo "::warning::skipping $name — no version in package.json"
              continue
            fi

            if [ -d "_gh-pages/foundations/$name/$version" ]; then
              echo "$name@$version is deployed, and a deployed version never changes"
              if [ -n "$previous" ] && ! git diff --quiet "$previous" HEAD -- "$foundation_dir/src"; then
                echo "::warning::foundations/$name changed since $previous, but $version is already deployed. Bump its version to ship the change."
              fi
              continue
            fi

            echo "=========================================="
            echo "Building $name@$version"
            echo "=========================================="

            # Per-foundation install. The flip-workspace-deps step above
            # already rewrote each foundation's package.json so workspace:*
            # → ^<npm-version>; pnpm install resolves cleanly.
            (cd "$foundation_dir" && pnpm install --ignore-workspace --no-frozen-lockfile)

            # Build via the foundation's own script. uniweb is in the
            # foundation's devDeps after the install above.
            (cd "$foundation_dir" && pnpm build)

            if [ ! -d "$foundation_dir/dist" ]; then
              echo "::error::build produced no dist/ for $name"
              exit 1
            fi

            # Stage under the deploy path: foundations/<name>/<version>/
            mkdir -p "_staging/foundations/$name/$version"
            cp -R "$foundation_dir/dist/." "_staging/foundations/$name/$version/"
            echo "Staged $name@$version → foundations/$name/$version/"
          done

          echo "=========================================="
          echo "Staging tree:"
          find _staging -maxdepth 4 -type d | sort

      - name: Layer onto gh-pages branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Configure git for the deploy commit. Using the workflow bot
          # so the gh-pages history is clearly machine-generated.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Layer the staged versions onto the existing tree: a new
          # directory beside the older ones, which stay as they are.
          mkdir -p _gh-pages/foundations
          if [ -d _staging/foundations ]; then
            cp -R _staging/foundations/. _gh-pages/foundations/
          fi

          # Disable Jekyll. GitHub Pages defaults to Jekyll processing,
          # which silently excludes any file or directory starting with
          # an underscore — including the foundation's `_entry.generated-*.js`
          # entry chunk and `_commonjs-dynamic-modules-*.js`. Both 404 from
          # the published URL even though they're committed on gh-pages.
          # The marker file disables Jekyll entirely so every file ships
          # verbatim. Idempotent — re-creating it on each deploy is fine.
          touch _gh-pages/.nojekyll

          # Write a top-level index for human visitors. Listing what's
          # currently deployed; lets anyone confirm a foundation is live
          # without having to guess paths.
          {
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>unipress foundations</title>'
            echo '<style>body{font-family:system-ui;max-width:60ch;margin:3rem auto;padding:0 1rem;line-height:1.5;color:#1a1a1a}h1{font-size:1.5rem}h2{font-size:1.1rem;margin-top:2rem}a{color:#5a6fd6}code{background:#f3f3f3;padding:0.1em 0.35em;border-radius:3px}</style></head><body>'
            echo '<h1>unipress foundations</h1>'
            echo '<p>Built foundations served at stable versioned URLs for the <a href="https://github.com/uniweb/unipress">unipress</a> CLI.</p>'
            echo '<p>URL pattern: <code>https://uniweb.github.io/unipress/foundations/&lt;name&gt;/&lt;version&gt;/entry.js</code></p>'
            for fdir in _gh-pages/foundations/*/; do
              name=$(basename "$fdir")
              echo "<h2>@unipress/$name</h2><ul>"
              for vdir in "$fdir"*/; do
                version=$(basename "$vdir")
                echo "<li><a href=\"foundations/$name/$version/entry.js\">$version</a></li>"
              done
              echo "</ul>"
            done
            echo '</body></html>'
          } > _gh-pages/index.html

          # Commit + push if anything changed.
          cd _gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No foundation changes to deploy."
            exit 0
          fi
          git commit -m "deploy: foundations from ${GITHUB_SHA::7}"
          git push origin gh-pages
